Configuration:
  status: warn
  Appenders:
    Console:
      Name: Console_Appender
      Target: SYSTEM_OUT
      PatternLayout:
        Pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
  Loggers:
    Root:
      Level: info
      AppenderRef:
        Ref: Console_Appender
